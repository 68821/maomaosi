<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>猫猫寺？大兴善寺。· 扫码进入</title>
<meta name="description" content="猫是入口，历史是底色。扫码走进一座千年古寺——大兴善寺。" />
<style>
  :root{
    --orange:#E89B5A; --red:#B23A2E; --ink:#2b2f33; --gray:#3F454A;
    --cream:#F5EFE6; --gold:#C9A227;
    --serif:'Noto Serif SC','Source Han Serif SC','思源宋体','Songti SC','SimSun',serif;
    --sans:'Noto Sans SC','Source Han Sans SC','思源黑体','PingFang SC','Microsoft YaHei',sans-serif;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    font-family:var(--sans); color:var(--ink);
    background:linear-gradient(165deg,#f7e2c6 0%,#eecb9f 55%,#e6bf92 100%);
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:36px 20px; -webkit-font-smoothing:antialiased;
  }
  .card{
    position:relative; width:100%; max-width:460px;
    background:rgba(255,252,247,.9); border-radius:30px;
    padding:44px 40px 38px; text-align:center;
    box-shadow:0 30px 70px rgba(120,80,40,.25), inset 0 0 0 1px rgba(255,255,255,.6);
    overflow:hidden;
  }
  .card::before{ /* 顶部暖色光带 */
    content:""; position:absolute; top:0; left:0; right:0; height:6px;
    background:linear-gradient(90deg,var(--orange),var(--gold),var(--orange));
  }
  .pawmark{
    position:absolute; right:-30px; bottom:-30px; width:150px; height:150px;
    color:var(--orange); opacity:.07; pointer-events:none;
  }
  .brand{
    display:inline-flex; align-items:center; gap:8px;
    font-size:15px; letter-spacing:.28em; color:var(--gray); opacity:.8;
  }
  .brand svg{ width:18px; height:18px; color:var(--orange); }
  h1{
    font-family:var(--serif); font-weight:900; line-height:1.28;
    font-size:40px; margin-top:18px; letter-spacing:.03em;
  }
  h1 .q{ color:var(--ink); }
  h1 .a{ color:var(--red); }
  .tag{ margin-top:14px; font-family:var(--serif); font-size:17px; letter-spacing:.18em; color:var(--gray); }
  .qrbox{
    margin:30px auto 0; width:min(76vw,300px);
    background:#fff; border-radius:22px; padding:22px;
    box-shadow:0 14px 40px rgba(120,80,40,.16);
    border:1px solid rgba(232,155,90,.35);
  }
  .qrbox .scan{
    display:flex; align-items:center; justify-content:center; gap:8px;
    font-size:14px; letter-spacing:.34em; color:#9a6a35; margin-bottom:14px;
  }
  .qrbox .scan::before,.qrbox .scan::after{
    content:""; width:26px; height:1px; background:rgba(232,155,90,.5);
  }
  .qrbox svg{ display:block; width:100%; height:auto; shape-rendering:crispEdges; }
  .url{
    display:inline-block; margin-top:26px;
    font-size:15px; color:#7a5a3a; letter-spacing:.02em;
    word-break:break-all; text-decoration:none;
    padding:8px 16px; border-radius:999px; background:rgba(232,155,90,.14);
    border:1px solid rgba(232,155,90,.35);
  }
  .url:hover{ background:rgba(232,155,90,.22); }
  .copybtn{
    display:block; width:100%; margin-top:14px;
    padding:16px 0; border:none; border-radius:999px; cursor:pointer;
    font-family:var(--sans); font-size:17px; font-weight:600; letter-spacing:.12em;
    color:var(--cream); background:linear-gradient(135deg,var(--orange),#d9823c);
    box-shadow:0 10px 26px rgba(232,155,90,.35); transition:transform .16s ease;
  }
  .copybtn:active{ transform:scale(.97); }
  .foot{ margin-top:24px; font-size:13px; letter-spacing:.18em; color:var(--gray); opacity:.62; }
  .note{ margin-top:8px; font-size:12px; color:var(--gray); opacity:.45; letter-spacing:.04em; }
  @media (prefers-reduced-motion:reduce){ *{ transition:none !important; } }
</style>
</head>
<body>
  <main class="card">
    <svg class="pawmark" viewBox="0 0 100 100" aria-hidden="true">
      <ellipse cx="30" cy="42" rx="11" ry="14" fill="currentColor" transform="rotate(-18 30 42)"/>
      <ellipse cx="46" cy="30" rx="11" ry="14" fill="currentColor" transform="rotate(-6 46 30)"/>
      <ellipse cx="54" cy="30" rx="11" ry="14" fill="currentColor" transform="rotate(6 54 30)"/>
      <ellipse cx="70" cy="42" rx="11" ry="14" fill="currentColor" transform="rotate(18 70 42)"/>
      <path d="M50 52 C33 52 24 66 24 79 C24 90 36 98 50 98 C64 98 76 90 76 79 C76 66 67 52 50 52 Z" fill="currentColor"/>
    </svg>

    <div class="brand">
      <svg viewBox="0 0 100 100"><use href="#paw"/></svg>
      猫猫寺 · 大兴善寺
    </div>
    <h1><span class="q">猫猫寺？</span><br><span class="a">大兴善寺。</span></h1>
    <p class="tag">猫是入口，历史是底色。</p>

    <div class="qrbox">
      <div class="scan">扫 一 扫</div>

    </div>

    <a class="url" href="https://68821.github.io/maomaosi/">68821.github.io/maomaosi</a>
    <button class="copybtn" id="copyBtn">复制链接</button>
    <div class="foot">从一只猫，走进一座祖庭。</div>
    <div class="note">微信 / 手机相机扫码均可 · 建议手机竖屏浏览</div>
  </main>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs><symbol id="paw" viewBox="0 0 100 100">
      <ellipse cx="30" cy="42" rx="11" ry="14" fill="currentColor" transform="rotate(-18 30 42)"/>
      <ellipse cx="46" cy="30" rx="11" ry="14" fill="currentColor" transform="rotate(-6 46 30)"/>
      <ellipse cx="54" cy="30" rx="11" ry="14" fill="currentColor" transform="rotate(6 54 30)"/>
      <ellipse cx="70" cy="42" rx="11" ry="14" fill="currentColor" transform="rotate(18 70 42)"/>
      <path d="M50 52 C33 52 24 66 24 79 C24 90 36 98 50 98 C64 98 76 90 76 79 C76 66 67 52 50 52 Z" fill="currentColor"/>
    </symbol></defs>
  </svg>

  <script>
    const URL = 'https://68821.github.io/maomaosi/';
    const btn = document.getElementById('copyBtn');
    btn.addEventListener('click', async () => {
      let ok = false;
      try { await navigator.clipboard.writeText(URL); ok = true; }
      catch(e){
        const ta = document.createElement('textarea');
        ta.value = URL; ta.style.position='fixed'; ta.style.opacity='0';
        document.body.appendChild(ta); ta.select();
        try { ok = document.execCommand('copy'); } catch(_) {}
        ta.remove();
      }
      btn.textContent = ok ? '✓ 已复制，快去分享吧' : '复制失败，请长按上方链接';
      setTimeout(()=>{ btn.textContent = '复制链接'; }, 2000);
    });
  </script>
</body>
</html>
